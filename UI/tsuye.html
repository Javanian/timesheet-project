<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timesheet Dashboard</title>
  <style>
    :root {
      --primary-color: #3d4ff5;
      --primary-dark: #97aff3;
      --success-color: #10b981;
      --success-dark: #0aca8d;
      --danger-color: #ef4444;
      --warning-color: #f59e0b;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --border-radius: 0.5rem;
      --transition: all 0.2s ease-in-out;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, var(--gray-50) 0%, var(--gray-100) 100%);
      color: var(--gray-800);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem;
    }

    .header {
      background: white;
      padding: 2rem;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
      border: 1px solid var(--gray-200);
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .filter-group label {
      font-weight: 600;
      color: var(--gray-700);
      font-size: 0.875rem;
    }

    .search-input, .date-input {
      padding: 0.55rem 1rem;
      border: 2px solid var(--gray-200);
      border-radius: var(--border-radius);
      font-size: 1rem;
      transition: var(--transition);
      background: white;
    }

    .search-input:focus, .date-input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgb(37 99 235 / 0.1);
    }

    .filter-actions {
      display: flex;
      gap: 1rem;
      align-items: end;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: var(--border-radius);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: var(--primary-color);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--gray-500);
      color: white;
    }

    .btn-secondary:hover {
      background: var(--gray-600);
    }

    .stats {
      display: flex;
      gap: 1rem;
      padding: 1rem 0;
      border-top: 1px solid var(--gray-200);
    }

    .stat-card {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      color: white;
      padding: 1rem;
      border-radius: var(--border-radius);
      flex: 1;
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .stat-label {
      font-size: 0.875rem;
      opacity: 0.9;
    }

    .table-container {
      background: white;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid var(--gray-200);
    }

    .table-wrapper {
      overflow-x: hidden;
      max-height: 60vh;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    th {
      background: linear-gradient(135deg, var(--gray-800), var(--gray-700));
      color: white;
      padding: 1rem 0.75rem;
      text-align: left;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--gray-600);
    }

    .parent-row {
      background: linear-gradient(135deg, var(--gray-50), white);
      font-weight: 600;
      border-left: 4px solid var(--primary-color);
      cursor: pointer;
      transition: var(--transition);
    }

    .parent-row:hover {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      color: white;
      transform: scale(1.002);
    }

    .parent-row.expanded {
      background: linear-gradient(135deg, var(--success-color), var(--success-dark));
      color: white;
    }

    .child-row {
      background: white;
      border-left: 4px solid var(--gray-200);
      transition: var(--transition);
      transform-origin: top;
    }

    .child-row:hover {
      background: var(--gray-50);
      cursor: pointer;
    }

    .child-row.validated {
      background: linear-gradient(135deg, #dcfce7, #bbf7d0);
      border-left-color: var(--success-color);
    }

    .child-row.hide {
      display: none;
    }

    .child-row.show {
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: scaleY(0);
      }
      to {
        opacity: 1;
        transform: scaleY(1);
      }
    }

    td {
      padding: 0.75rem;
      border-bottom: 1px solid var(--gray-200);
      vertical-align: middle;
    }

    .expand-icon {
      display: inline-block;
      transition: transform 0.3s ease;
      margin-right: 0.5rem;
      font-size: 1.2em;
    }

    .expand-icon.expanded {
      transform: rotate(90deg);
    }

    .validate-btn {
      padding: 0.375rem 0.75rem;
      background: var(--success-color);
      color: white;
      border: none;
      border-radius: 0.375rem;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      transition: var(--transition);
    }

    .validate-btn:hover {
      background: var(--success-dark);
      transform: scale(1.05);
    }

    .validate-btn:disabled {
      background: var(--gray-300);
      cursor: not-allowed;
      transform: none;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      color: var(--gray-500);
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--gray-200);
      border-top: 2px solid var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 0.5rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .no-data {
      text-align: center;
      padding: 3rem;
      color: var(--gray-500);
    }

    .status-badge {
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .status-validated {
      background: var(--success-color);
      color: white;
    }

    .status-pending {
      background: var(--warning-color);
      color: white;
    }

    @media (max-width: 768px) {
      .container {
        padding: 0.5rem;
      }

      .header {
        padding: 1rem;
      }

      .header h1 {
        font-size: 1.75rem;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .filter-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .stats {
        flex-direction: column;
      }

      th, td {
        padding: 0.5rem;
        font-size: 0.75rem;
      }

      .table-wrapper {
        max-height: 60vh;
      }
    }

    .duration-cell {
      font-weight: 600;
      color: var(--primary-color);
    }

    .datetime-cell {
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      
      
      <div class="filters">
        <div class="filter-group">
          <label>🔍 Search (Serial, Name, Workcenter, Order)</label>
          <input type="text" id="searchInput" class="search-input" placeholder="Type to search...">
        </div>
        
        <div class="filter-group">
          <label>📅 Start Date</label>
          <input type="date" id="startDate" class="date-input">
        </div>
        
        <div class="filter-group">
          <label>📅 End Date</label>
          <input type="date" id="endDate" class="date-input">
        </div>
        
        <div class="filter-actions">
          <button id="filterBtn" class="btn btn-primary">
            🔍 Filter
          </button>
          <button id="resetBtn" class="btn btn-secondary">
            🔄 Reset
          </button>
        </div>
      </div>

      <div class="stats">
        <div class="stat-card">
          <div class="stat-value" id="totalHours">0.0</div>
          <div class="stat-label">Total Hours</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="totalRecords">0</div>
          <div class="stat-label">Records</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="totalGroups">0</div>
          <div class="stat-label">Employees</div>
        </div>
      </div>
    </div>

    <div class="table-container">
      <div class="table-wrapper">
        <table id="timesheetTable">
          <thead>
            <tr>
              <th>Serial Number</th>
              <th>Full Name</th>
              <th>Production Order</th>
              <th>SSBR Ident</th>
              <th>Operation Text</th>
              <th>Seq</th>
              <th>Check In</th>
              <th>Check Out</th>
              <th>Duration</th>
              <th>Workcenter</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="12" class="loading">
                <div class="spinner"></div>
                Loading timesheet data...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let allData = [];
    let filteredData = [];
    let groupedData = {};
    let expandedGroups = new Set();

    // Load data from API
    async function loadTimesheets(startDate = '', endDate = '') {
      try {
        document.getElementById('tableBody').innerHTML = `
          <tr>
            <td colspan="12" class="loading">
              <div class="spinner"></div>
              Loading timesheet data...
            </td>
          </tr>
        `;

        let url = '/timesheet/';
        if (startDate && endDate) {
          url = `/timesheet/search?field=longdate_checkin&start=${startDate}&end=${endDate}`;
        }
        
        const res = await fetch(url);
        const data = await res.json();
        
        allData = data;
        filteredData = data;
        processData();
        
      } catch (err) {
        console.error('Error loading timesheets:', err);
        document.getElementById('tableBody').innerHTML = `
          <tr>
            <td colspan="12" class="no-data">
              ❌ Failed to load timesheet data. Please try again.
            </td>
          </tr>
        `;
      }
    }

    // Group data by serial number
    function groupBySerial(data) {
      const grouped = {};
      data.forEach(item => {
        const serial = item.serialnumber || 'Unknown';
        if (!grouped[serial]) {
          grouped[serial] = [];
        }
        grouped[serial].push(item);
      });
      return grouped;
    }

    // Calculate group summary
    function calculateGroupSummary(children) {
      const totalDuration = children.reduce((sum, child) => {
        const duration = parseFloat(child.duration) || 0;
        return sum + duration;
      }, 0);

      const checkinTimes = children
        .map(child => child.longdate_checkin)
        .filter(Boolean)
        .map(time => new Date(time));
      
      const checkoutTimes = children
        .map(child => child.longdate_checkout)
        .filter(Boolean)
        .map(time => new Date(time));

      const minCheckin = checkinTimes.length ? new Date(Math.min(...checkinTimes)) : null;
      const maxCheckout = checkoutTimes.length ? new Date(Math.max(...checkoutTimes)) : null;

      return {
        serialNumber: children[0].serialnumber,
        fullName: children[0].full_name,
        totalDuration: totalDuration.toFixed(2),
        minCheckin: minCheckin,
        maxCheckout: maxCheckout,
        childCount: children.length
      };
    }

    // Format datetime for display
    function formatDateTime(dateTime) {
      if (!dateTime) return '';
      const d = new Date(dateTime);
      return d.toLocaleString('en-GB', {
        timeZone: 'Asia/Singapore',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).replace(',', '');
    }

    // Create parent row
    function createParentRow(serial, summary, isExpanded) {
      const tr = document.createElement('tr');
      tr.className = `parent-row ${isExpanded ? 'expanded' : ''}`;
      tr.dataset.serial = serial;
      
      tr.innerHTML = `
        <td>
          <span class="expand-icon ${isExpanded ? 'expanded' : ''}">▶</span>
          ${summary.serialNumber}
        </td>
        <td>${summary.fullName || ''}</td>
        <td colspan="4">
          <span style="opacity: 0.7; font-size: 0.8em;">
            ${summary.childCount} Activity
          </span>
        </td>
        <td class="datetime-cell">${formatDateTime(summary.minCheckin)}</td>
        <td class="datetime-cell">${formatDateTime(summary.maxCheckout)}</td>
        <td class="duration-cell">${summary.totalDuration}</td>
        <td colspan="2"></td>
        <td>
          <button class="validate-btn" onclick="validateGroup('${serial}')">
            ✓ Group
          </button>
        </td>
      `;

      tr.addEventListener('click', (e) => {
        if (e.target.tagName !== 'BUTTON') {
          toggleGroup(serial);
        }
      });

      return tr;
    }

    // Create child row
    function createChildRow(item, isVisible) {
      const tr = document.createElement('tr');
      const isValidated = !!item.validation_date;
      
      tr.className = `child-row ${isValidated ? 'validated' : ''} ${isVisible ? 'show' : 'hide'}`;
      tr.dataset.tsnumber = item.tsnumber;
      tr.dataset.serial = item.serialnumber;

      tr.innerHTML = `
        <td style="padding-left: 2rem;">${item.serialnumber || ''}</td>
        <td>${item.full_name || ''}</td>
        <td>${item.production_order || ''}</td>
        <td>${item.ssbr_ident || ''}</td>
        <td>${item.operation_text || ''}</td>
        <td>${item.seq || ''}</td>
        <td class="datetime-cell">${item.date_checkin || ''} ${item.hour_checkin || ''}</td>
        <td class="datetime-cell">${item.date_checkout || ''} ${item.hour_checkout || ''}</td>
        <td class="duration-cell">${item.duration || '0'}</td>
        <td>${item.workcentercode || ''}</td>
        <td>
          ${isValidated 
            ? '<span class="status-badge status-validated">✓ Validated</span>'
            : '<span class="status-badge status-pending">⏳ Pending</span>'
          }
        </td>
        <td>
          <button class="validate-btn" onclick="validateSingle('${item.tsnumber}')" ${isValidated ? 'disabled' : ''}>
            ✓
          </button>
        </td>
      `;

      if (!isValidated) {
        tr.addEventListener('click', (e) => {
          if (e.target.tagName !== 'BUTTON') {
            window.location.href = `tsuyeedit?id=${item.tsnumber}`;
          }
        });
      }

      return tr;
    }

    // Toggle group expansion
    function toggleGroup(serial) {
      const isExpanded = expandedGroups.has(serial);
      const parentRow = document.querySelector(`[data-serial="${serial}"].parent-row`);
      const childRows = document.querySelectorAll(`[data-serial="${serial}"].child-row`);
      const expandIcon = parentRow.querySelector('.expand-icon');

      if (isExpanded) {
        expandedGroups.delete(serial);
        parentRow.classList.remove('expanded');
        expandIcon.classList.remove('expanded');
        childRows.forEach(row => {
          row.classList.remove('show');
          row.classList.add('hide');
        });
      } else {
        expandedGroups.add(serial);
        parentRow.classList.add('expanded');
        expandIcon.classList.add('expanded');
        childRows.forEach(row => {
          row.classList.remove('hide');
          row.classList.add('show');
        });
      }
    }

    // Process and render data
    function processData() {
      groupedData = groupBySerial(filteredData);
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (filteredData.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="12" class="no-data">
              📭 No timesheet data found. Try adjusting your filters.
            </td>
          </tr>
        `;
        updateStats();
        return;
      }

      // Create rows for each group
      Object.entries(groupedData).forEach(([serial, children]) => {
        const summary = calculateGroupSummary(children);
        const isExpanded = expandedGroups.has(serial);

        // Add parent row
        tbody.appendChild(createParentRow(serial, summary, isExpanded));

        // Add child rows
        children.forEach(child => {
          tbody.appendChild(createChildRow(child, isExpanded));
        });
      });

      updateStats();
    }

    // Update statistics
    function updateStats() {
      const totalHours = filteredData.reduce((sum, item) => {
        return sum + (parseFloat(item.duration) || 0);
      }, 0);

      document.getElementById('totalHours').textContent = totalHours.toFixed(1);
      document.getElementById('totalRecords').textContent = filteredData.length;
      document.getElementById('totalGroups').textContent = Object.keys(groupedData).length;
    }

    // Apply search filter
    function applySearchFilter() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      
      if (!searchTerm) {
        filteredData = [...allData];
      } else {
        filteredData = allData.filter(item => {
          return (
            (item.serialnumber || '').toLowerCase().includes(searchTerm) ||
            (item.full_name || '').toLowerCase().includes(searchTerm) ||
            (item.workcentercode || '').toLowerCase().includes(searchTerm) ||
            (item.production_order || '').toLowerCase().includes(searchTerm)
          );
        });
      }
      
      processData();
    }

    // Validate single record
    async function validateSingle(tsnumber) {
      try {
        await fetch('/timesheet/validation', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tsnumbers: [tsnumber] })
        });
        
        // Reload data to reflect changes
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        loadTimesheets(
          startDate ? `${startDate} 00:00:00` : '',
          endDate ? `${endDate} 23:59:59` : ''
        );
        
      } catch (err) {
        console.error('Validation error:', err);
        alert('Failed to validate record');
      }
    }

    // Validate entire group
    async function validateGroup(serial) {
      try {
        const groupData = groupedData[serial];
        const tsnumbers = groupData.map(item => item.tsnumber);
        
        await fetch('/timesheet/validation', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tsnumbers })
        });
        
        // Reload data to reflect changes
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        loadTimesheets(
          startDate ? `${startDate} 00:00:00` : '',
          endDate ? `${endDate} 23:59:59` : ''
        );
        
      } catch (err) {
        console.error('Group validation error:', err);
        alert('Failed to validate group');
      }
    }

    // Event listeners
    document.getElementById('searchInput').addEventListener('input', applySearchFilter);

    document.getElementById('filterBtn').addEventListener('click', () => {
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      
      if (startDate && endDate) {
        loadTimesheets(`${startDate} 00:00:00`, `${endDate} 23:59:59`);
      } else {
        loadTimesheets();
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('startDate').value = '';
      document.getElementById('endDate').value = '';
      document.getElementById('searchInput').value = '';
      expandedGroups.clear();
      loadTimesheets();
    });

    // Make functions globally accessible
    window.validateSingle = validateSingle;
    window.validateGroup = validateGroup;

    // Initialize
    loadTimesheets();
  </script>
</body>
</html>
