<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main Menu</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="page-container">

    <!-- Header -->
    <header class="app-header flex-between">
      <button class="btn btn-secondary small" onclick="goHome()">Back</button>
      <div class="switch-wrapper">
        <label class="switch">
          <input type="checkbox" id="myswitch">
          <span class="slider"></span>
        </label>
        <span id="switchLabel">Single</span>
      </div>
      <button class="btn btn-secondary small">Refresh</button>
    </header>

    <!-- Main content -->
    <section class="main-content">
      <!-- Info user & order -->
      <div class="info-box">
        <div class="row"><span class="label">Nama</span><span class="value" id="namaku">-</span></div>
        <div class="row"><span class="label">SN Karyawan</span><span class="value" id="snku">-</span></div>
        <div class="row"><span class="label">Work Center</span><span class="value" id="wctku">-</span></div>
        <div class="row"><span class="label">Prod Order</span><span class="value" id="orderku">-</span></div>
        <div class="row"><span class="label">Activity</span><span class="value" id="activityku">-</span></div>

        <!-- Bottom actions inside info box -->
        <div class="info-actions">
          <button class="btn btn-warning small2">Rework</button>
          <button class="btn btn-success small2" onclick="finish()">Finish</button>
        </div>
      </div>

      <!-- Action buttons (side of info box) -->
      <div class="action-buttons">
        <button class="btn btn-primary" onclick="postdata()">Start</button>
        <button class="btn btn-primary" onclick="gotojob()">Select Job</button>
        <button class="btn btn-primary" onclick="gotomesin()">Select Machine</button>
        <button class="btn btn-primary">Process Control</button>
        <button class="btn btn-primary" onclick="gotots()">View Timesheet</button>
        <button class="btn btn-primary">Consumable & Tools</button>
      </div>
    </section>
  </div>

  <!-- Script -->
  <script src="js/previewdata.js"></script>
  <script src="js/script.js"></script>
  <script src="js/postdata.js"></script>
</body>
</html>
