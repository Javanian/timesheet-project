<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Production Dashboard</title>
  <link href="css/output.css" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen">

  <div class="max-w-6xl mx-auto p-4">

    <!-- HEADER -->
    <header class="bg-white rounded-xl p-4 shadow-sm mb-4 flex items-center justify-between">
      
      <!-- Left -->
      <div class="flex items-center gap-3">
        <button onclick="goHome()" 
          class="bg-gray-200 text-gray-800 px-3 py-2 rounded-lg text-sm font-semibold">
          ← Back
        </button>

        
      </div>

      <!-- Right -->
      <button class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">
        Refresh
      </button>
    </header>

    <!-- MAIN GRID -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">

      <!-- LEFT PANEL -->
      <div class="bg-white p-4 rounded-xl shadow-sm flex flex-col">

        <h2 class="text-lg font-bold text-gray-800 mb-3">Current Session</h2>

        <!-- INFO BOX -->
        <div class="flex flex-col gap-3 mb-4">

          <div class="flex justify-between border-b pb-2">
            <span class="text-sm text-gray-500 font-semibold">Nama</span>
            <span class="text-sm font-semibold text-gray-900" id="namaku">-</span>
          </div>

          <div class="flex justify-between border-b pb-2">
            <span class="text-sm text-gray-500 font-semibold">SN Karyawan</span>
            <span class="text-sm font-semibold text-gray-900" id="snku">-</span>
          </div>

          <div class="flex justify-between border-b pb-2">
            <span class="text-sm text-gray-500 font-semibold">Work Center</span>
            <span class="text-sm font-semibold text-gray-900" id="wctku">-</span>
          </div>

          <div class="flex justify-between border-b pb-2">
            <span class="text-sm text-gray-500 font-semibold">Prod Order</span>
            <span class="text-sm font-semibold text-gray-900" id="orderku">-</span>
          </div>

          <div class="flex justify-between">
            <span class="text-sm text-gray-500 font-semibold">Activity</span>
            <span class="text-sm font-semibold text-gray-900" id="activityku">-</span>
          </div>

        </div>

        <!-- QUICK ACTIONS -->
        <div class="grid grid-cols-2 gap-3 mt-auto">

          <button 
            class="bg-orange-500 text-white rounded-lg p-4 flex flex-col justify-center items-center gap-1 h-[50px]">
            <img src="css/svg-white/stop-circle.svg" class="w-5 h-5">
            <span class="text-sm font-semibold">Rework</span>
          </button>

          <button onclick="finish()"
            class="bg-green-600 text-white rounded-lg p-4 flex flex-col justify-center items-center gap-1 h-[50px]">
            <img src="css/svg-white/check.svg" class="w-5 h-5">
            <span class="text-sm font-semibold">Finish</span>
          </button>

        </div>

      </div>

      <!-- RIGHT PANEL (TILES) -->
      <div class="grid grid-cols-2 sm:grid-cols-2 gap-4">

        <button onclick="postdata()" 
          class="bg-blue-600 text-white rounded-lg p-4 flex flex-col items-center justify-center gap-2 ">
          <img src="css/svg-white/play-circle.svg" class="w-5 h-5">
          <span class="text-sm font-semibold">Start</span>
        </button>

        <button onclick="gotojob()"
          class="bg-blue-600 text-white rounded-lg p-4 flex flex-col items-center justify-center gap-2 ">
          <img src="css/svg-white/list.svg" class="w-5 h-5">
          <span class="text-sm font-semibold">Select Job</span>
        </button>

        <button onclick="gotomesin()"
          class="bg-blue-600 text-white rounded-lg p-4 flex flex-col items-center justify-center gap-2 ">
          <img src="css/svg-white/monitor.svg" class="w-5 h-5">
          <span class="text-sm font-semibold">Select Machine</span>
        </button>

        <button onclick="gotoparameter()"
          class="bg-blue-600 text-white rounded-lg p-4 flex flex-col items-center justify-center gap-2 ">
          <img src="css/svg-white/settings.svg" class="w-5 h-5">
          <span class="text-sm font-semibold">Process Control</span>
        </button>

        <button onclick="gotots()"
          class="bg-blue-600 text-white rounded-lg p-4 flex flex-col items-center justify-center gap-2 ">
          <img src="css/svg-white/clock.svg" class="w-5 h-5">
          <span class="text-sm font-semibold">View Timesheet</span>
        </button>

        <button 
          class="bg-blue-600 text-white rounded-lg p-4 flex flex-col items-center justify-center gap-2 ">
          <img src="css/svg-white/tool.svg" class="w-5 h-5">
          <span class="text-sm font-semibold">Consumable</span>
        </button>

      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="js/previewdata.js"></script>
  <script src="js/script.js"></script>
  <script src="js/postdata.js"></script>

</body>
</html>
