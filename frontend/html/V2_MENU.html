<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MENU</title>
  <link rel="stylesheet" href="css/V2menu.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="dashboard">
  <header class="header">
    <button class="btn-header" onclick="goHome()">
      <i class="fa fa-arrow-left"></i> BACK
    </button>
    <div class="switch-wrap">
      <label class="switch">
        <input type="checkbox" id="myswitch" />
        <span class="slider"></span>
      </label>
      <span id="switchLabel">Single</span>
    </div>
    <button class="btn-header" onclick="loadData()">
      <i class="fa fa-sync"></i> REFRESH
    </button>
  </header>

  <main class="content-grid">
    <!-- Info Panel -->
    <section class="info-panel">
      <div class="info-card">
        <div class="row"><i class="fa fa-user"></i><span>NAMA</span><span id="namaku"></span></div>
        <div class="row"><i class="fa fa-id-badge"></i><span>SN KARYAWAN</span><span id="snku"></span></div>
        <div class="row"><i class="fa fa-industry"></i><span>WORK CENTER</span><span id="wctku"></span></div>
        <div class="row"><i class="fa fa-receipt"></i><span>PRODUCTION ORDER</span><span id="orderku"></span></div>
        <div class="row"><i class="fa fa-tasks"></i><span>ACTIVITY</span><span id="activityku"></span></div>
      </div>
      <div class="bottom-actions">
        <button class="btn-action"><i class="fa fa-undo"></i> REWORK</button>
        <button class="btn-action" onclick="finish()"><i class="fa fa-check"></i> FINISH</button>
      </div>
    </section>

    <!-- Menu Panel -->
    <section class="menu-panel">
      <button class="menu-button" onclick="postdata()"><i class="fa fa-play"></i><span>START</span></button>
      <button class="menu-button" onclick="gotojob()"><i class="fa fa-briefcase"></i><span>SELECT JOB</span></button>
      <button class="menu-button" onclick="gotomesin()"><i class="fa fa-cogs"></i><span>SELECT MACHINE</span></button>
      <button class="menu-button"><i class="fa fa-eye"></i><span>VIEW SOW</span></button>
      <button class="menu-button" onclick="gotots()"><i class="fa fa-clock"></i><span>VIEW TIMESHEET</span></button>
      <button class="menu-button"><i class="fa fa-wrench"></i><span>CONSUMABLE & TOOLS</span></button>
    </section>
  </main>
</body>


</html>
