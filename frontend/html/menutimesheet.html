<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MENU</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/faw640.css" />
</head>

<div class="container-vertical" style="margin: 10px ;height: calc(100% - 20px);
        justify-content: flex-start;
        gap: 5px; width:calc(100% - 20px);border:none">
    <div class="container-title-horizontal"
        style="padding: 0px; overflow:hidden;display:flex;align-items:center;justify-content:space-between">
        <div class="button-utama full" onclick="goToMenu()" style="max-width: 100px;border-radius: 12px;">
            <img src="svg-white/arrow-left-circle.svg">
            
        </div>



        <div class="button-utama full" style="max-width: 100px;border-radius: 12px;">
          <img src="svg-white/repeat.svg"></div>
    </div>
    <div class="container-horizontal" style="border: none;padding:0px;overflow: auto;">
        <div class="container-vertical-child" style="overflow: auto;flex:1">

            <div id="gallery" class="gallery"></div>
        </div>

    </div>

<script>

    function goToMenu() {
  window.location.href = "mainmenu.html";
}
const datakaryawan = JSON.parse(sessionStorage.getItem("datakaryawan"));
const serialnumber = datakaryawan.snssb;

 let datatimesheet = []; // simpan data JSON global
    let selectedtimesheet = null;
  // load data.json
  fetch(`/timesheet/getsn/${serialnumber}`)
    .then(res => res.json())
    .then(data => {
      datatimesheet = data;
      renderGallery(datatimesheet);
    });

  // fungsi render gallery
  function renderGallery(data) {
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = ""; // clear isi lama

 // bikin header sekali di atas
  const header = document.createElement('div');
  header.className = 'containertimes header-row';
  header.style.maxHeight = '100px';
  header.innerHTML = `
    <div class="isitime2" style="flex:1;">Order</div>
    <div class="isitime2" style="flex:4;height:70px;line-height:70px;text-align:start;">Operation</div>
    <div class="containertime">
      <div class="isitime2">Check in</div>
      
    </div>
    <div class="containertime">
      <div class="isitime2">Check out</div>
    
    </div>
    <div class="isitime2" style="flex:1;">Work center</div>
    <div class="isitime2" style="flex:1;max-width:70px;"></div>
  `;
  gallery.appendChild(header);

    data.forEach(item => {
      const card = document.createElement('div');
      card.className = 'containertimes ';
      
        card.rowdatatimesheet = JSON.stringify({
        tsnumber: item.tsnumber,
        serialnumber:item.serialnumber,
        operation_no:item.seq,
        production_order:item.production_order,
        full_name: item.full_name,
        operation_text: item.operation_text,
        date_checkin: item.date_checkin,
        date_checkout: item.date_checkout,
        hour_checkin:item.hour_checkin,
        hour_checkout:item.hour_checkout,
        workcentercode:item.workcentercode,
        workcenterdescription:item.workcenterdescription
        
      });
      const stopButton = item.hour_checkout 
  ? ""  // kalau sudah ada hour_checkout, jangan render tombol STOP
  //<img src="svg-white/stop-circle.svg">
  //<img src="svg-white/play-circle.svg">
  : `<button class="buttontimes stop">Stop</button>`;
      const restartButton = item.hour_checkout 
  ? `<button class="buttontimesitijo restart">START</button>` 
  : "";

      card.innerHTML = `
      
        <div class="isitime" style="flex:1;">${item.production_order}</div>
        <div class="isitime" style="flex:4;height:70px;text-align:start; line-height:70px;">${item.operation_text}</div>
        <div class="containertime">
        <div class="isitime">${item.date_checkin}</div>
        <div class="isitime">${item.hour_checkin}</div>
        </div>
        <div class="containertime">
        <div class="isitime">${item.date_checkout || ""}</div>
        <div class="isitime">${item.hour_checkout || ""}</div>
        </div>
        <div class="isitime"  style="flex:1;">${item.workcenterdescription}</div>
        
            
       ${restartButton} 
      ${stopButton}
        
      `;
     

      gallery.appendChild(card);
    });
  }
gallery.addEventListener("click", async function (e) {
  if (e.target.classList.contains("stop")) {
    const card = e.target.closest(".containertimes");
    const rowData = JSON.parse(card.rowdatatimesheet);

    try {
      const updateRes = await fetch("/timesheet/checkoutid/", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          tsnumber: rowData.tsnumber   // kirim pk row ini
        }),
      });

      const updated = await updateRes.json();
      console.log("Update sukses:", updated);
       fetch(`/timesheet/getsn/${serialnumber}`)
    .then(res => res.json())
    .then(data => {
      datatimesheet = data;
      renderGallery(datatimesheet);
    });

      // contoh: hapus tombol Stop, ganti Restart
      e.target.outerHTML = `<button class="buttontimesitijo restart">Restart</button>`;
    } catch (err) {
      console.error("Gagal update:", err);
    }
  } else {
    const card = e.target.closest(".containertimes");
    const rowData = JSON.parse(card.rowdatatimesheet);
    console.log("RESTART untuk row:", rowData);

    try {
      const res = await fetch("/timesheet/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(rowData), // kirim data lama
      });
//
      const newItem = await res.json();
      console.log("Restart sukses, item baru:", newItem);

      // Refresh tampilan
      fetch(`/timesheet/getsn/${serialnumber}`)
    .then(res => res.json())
    .then(data => {
      datatimesheet = data;
      renderGallery(datatimesheet);
    });
    } catch (err) {
      console.error("Gagal restart:", err);
    }

  }
});

</script>


        </div>
    </div>
    





  </body>
</html>
