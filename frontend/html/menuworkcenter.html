<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>menuworkcenter
  </title>
  <link rel="stylesheet" href="css/style.css"> <!-- CSS lokal -->
</head>

<body>
  <div class="container text-center mt-5">

  </div>
  <div class="container-vertical" style="margin: 30px ;height: calc(100% - 60px);
        justify-content: flex-start;
        gap: 5px; width:calc(100% - 60px);">
    <div class="container-horizontal-child" style="gap:0px;max-height:50px">
      <div class="button-utama full" onclick="goToMenu()" style="max-width: 100px;border-radius: 0px;">
        BACK
      </div>
      <input type="text" id="searchInput" class="textinput" placeholder="Search Machine..." style="border-radius: 0px;">
      <div class="button-utama full" style="max-width: 100px;border-radius: 0px;">REFRESH</div>
      <!-- <div id="mesintext"></div> -->
    </div>

    <div id="gallerymesin" class="gallerymesin"></div>
  </div>


  <script>

    function goToMenu() {
      window.location.href = "mainmenu.html";
    }
    let datamesin = []; // simpan data JSON global
    let selectedmesin = null;
    // load data.json
    //http://100.107.210.61:3001/sow/

    fetch(`/workcenter/`)
      .then(res => res.json())
      .then(data => {
        datamesin = data;
        renderGallery(datamesin);
      });

    // fungsi render gallery
    function renderGallery(data) {
      const gallery = document.getElementById('gallerymesin');
      gallery.innerHTML = ""; // clear isi lama

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'cardmesin';
        const rowdatamesin = {
          workcenter_description: item.workcenter_description,
          machineid: item.machineid,
          groupname: item.groupname,
          workcenternew: item.workcenternew,

        };
        card.innerHTML = `
        <div class="label">Mesin:</div> <div class="value">${item.workcenter_description}</div>
        <div class="label">ID:</div> <div class="value">${item.machineid}</div>
        <div class="label">Group:</div> <div class="value">${item.groupname}</div>
        <div class="label">Workcenter:</div> <div class="value">${item.workcenternew}</div>
      `;
        card.addEventListener("click", async () => {
          selectedmesin = rowdatamesin;
          sessionStorage.setItem("selectedmesinku", JSON.stringify(selectedmesin));

          // ambil data karyawan (1 row)
          const datakaryawan = JSON.parse(sessionStorage.getItem("datakaryawan"));
          const nfcid = datakaryawan.nfcid;   // ✅ ambil langsung

          console.log("Row terpilih:", selectedmesin);
          let selectedmesinku = JSON.parse(sessionStorage.getItem("selectedmesinku"));
          sessionStorage.setItem("selectedmesinku", JSON.stringify(selectedmesin));

          try {
            // kirim update ke backend
            const datakaryawan = JSON.parse(sessionStorage.getItem("datakaryawan"));
            const response = await fetch("/usernfc/update/", {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                serialnumber: datakaryawan.snssb,          // SN karyawan
                machineid: selectedmesinku.machineid,        // ID mesin yg dipilih
                machinename: selectedmesinku.workcenter_description,    // Nama mesin
                workcenter: selectedmesinku.workcenternew    // Workcenter baru
              })
            }); if (!response.ok) throw new Error("Gagal update mesin");

    const updated = await response.json();
    console.log("Update mesin sukses:", updated);
    alert("Update mesin berhasil! ✅");

    // 2️⃣ Ambil row datakaryawan terbaru dari backend
    const res = await fetch(`/usernfc/nfcid/${nfcid}`);
    if (!res.ok) throw new Error("Gagal ambil data karyawan terbaru");

    const data = await res.json();
    if (data && Object.keys(data).length) {
      // update sessionStorage dengan row baru
      sessionStorage.setItem("datakaryawan", JSON.stringify(data));
      console.log("Session datakaryawan diupdate:", data);
    }

    // 3️⃣ Pindah halaman
    window.location.href = "mainmenu.html";

  } catch (err) {
    console.error(err);
    alert("Update mesin gagal: " + err.message);
  }})

        gallery.appendChild(card);
      });
    }

    // filter berdasarkan input text
    document.getElementById('searchInput').addEventListener('input', function () {
      const keyword = this.value.toLowerCase();

      const filtered = datamesin.filter(item =>
        item.workcenter_description.toLowerCase().includes(keyword) ||
        item.machineid.toLowerCase().includes(keyword) ||
        item.groupname.toLowerCase().includes(keyword)
      );

      renderGallery(filtered);
    });

  </script>

</body>

</html>
